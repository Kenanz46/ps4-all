<script>
  const canvas = document.getElementById('matrixCanvas');
  const ctx = canvas.getContext('2d');

  function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
  }
  resizeCanvas();
  window.addEventListener('resize', resizeCanvas);

  // حروف وأرقام ورموز سيبرانية نظيفة وواضحة 100% للمتصفح
  const safeChars = "0123456789ABCDEFHIJKLMNOPQRSTUVWXYZ<>[]{}/*#@$%+-=";
  const fontSize = 16;
  const columns = Math.floor(canvas.width / fontSize);
  
  const drops = [];
  for (let i = 0; i < columns; i++) {
      drops[i] = {
          y: Math.random() * canvas.height,
          speed: Math.random() * 1.8 + 1, // سرعة انسيابية هادئة
          chars: []
      };
      let length = Math.floor(Math.random() * 14 + 10);
      for (let j = 0; j < length; j++) {
          drops[i].chars.push(safeChars.charAt(Math.floor(Math.random() * safeChars.length)));
      }
  }

  function animate() {
      // طبقة التلاشي الخلفية بتعطي تأثير مسار (Trail) ناعم جداً
      ctx.fillStyle = 'rgba(5, 7, 12, 0.22)';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      ctx.font = 'bold ' + fontSize + 'px monospace';

      for (let i = 0; i < drops.length; i++) {
          let drop = drops[i];
          
          for (let j = 0; j < drop.chars.length; j++) {
              // جعل الحروف تتغير وتنبض بشكل حي ومتحرك أثناء النزول
              if (Math.random() > 0.90) {
                  drop.chars[j] = safeChars.charAt(Math.floor(Math.random() * safeChars.length));
              }

              // التلاشي التدريجي للشفافية
              let opacity = 1 - (j / drop.chars.length);
              let charX = i * fontSize;
              let charY = drop.y - (j * fontSize);

              if (charY >= -fontSize && charY <= canvas.height + fontSize) {
                  if (j === 0) {
                      // رأس الشريط يلمع بأبيض ناصع
                      ctx.fillStyle = 'rgba(255, 255, 255, 0.85)';
                  } else {
                      // بقية الشريط يتلاشى بلون نيون سيان فخم
                      ctx.fillStyle = 'rgba(0, 240, 255, ' + (opacity * 0.7) + ')';
                  }
                  ctx.fillText(drop.chars[j], charX, charY);
              }
          }

          // تحريك الشريط للأسفل
          drop.y += drop.speed;

          // إعادة التدوير من الأعلى عندما يختفي بالأسفل
          if (drop.y - (drop.chars.length * fontSize) > canvas.height) {
              drop.y = -50;
              drop.speed = Math.random() * 1.8 + 1;
              let length = Math.floor(Math.random() * 14 + 10);
              drop.chars = [];
              for (let j = 0; j < length; j++) {
                  drop.chars.push(safeChars.charAt(Math.floor(Math.random() * safeChars.length)));
              }
          }
      }

      requestAnimationFrame(animate);
  }

  requestAnimationFrame(animate);
</script>
