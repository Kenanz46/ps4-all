<script>
  const canvas = document.getElementById('matrixCanvas');
  const ctx = canvas.getContext('2d');

  function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
  }
  resizeCanvas();
  window.addEventListener('resize', resizeCanvas);

  const safeChars = "01ABCDEFXYZ<>[]{}/*#@$%+-=";
  const fontSize = 13;
  
  const particleCount = Math.floor((window.innerWidth * window.innerHeight) / 4500);
  const particles = [];

  for (let i = 0; i < particleCount; i++) {
      particles.push({
          x: Math.random() * canvas.width,
          y: Math.random() * canvas.height,
          speed: Math.random() * 0.8 + 0.3,
          char: safeChars.charAt(Math.floor(Math.random() * safeChars.length)),
          alpha: Math.random(),
          fading: Math.random() > 0.5 ? 0.01 : -0.01
      });
  }

  function animate() {
      // مسح نظيف وحاد للشاشة بدون أي تلطيش
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      ctx.font = fontSize + 'px monospace';

      for (let p of particles) {
          p.y += p.speed;

          p.alpha += p.fading;
          if (p.alpha <= 0.1 || p.alpha >= 0.85) {
              p.fading = -p.fading;
          }

          if (Math.random() < 0.02) {
              p.char = safeChars.charAt(Math.floor(Math.random() * safeChars.length));
          }

          // **تم تحويل اللون إلى الأخضر الفسفوري الكلاسيكي الخاص بفيلم الماتريكس**
          ctx.fillStyle = 'rgba(0, 255, 65, ' + p.alpha + ')';
          ctx.fillText(p.char, p.x, p.y);

          if (p.y > canvas.height) {
              p.y = -10;
              p.x = Math.random() * canvas.width;
              p.speed = Math.random() * 0.8 + 0.3;
          }
      }

      requestAnimationFrame(animate);
  }

  requestAnimationFrame(animate);
</script>
