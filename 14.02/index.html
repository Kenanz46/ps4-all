<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
    <title>PS4 Exploit Host - FW 14.02</title>
    <link rel="stylesheet" href="style.css">
    <style>
        /* فرض تناسق الألوان وسرعة الواجهة مع إبقاء عناصر البايلودز والكونسول بكامل فعاليتها */
        body {
            background-color: #111827;
            color: #ffffff;
            font-family: monospace;
            margin: 0;
            padding: 20px;
        }
        .main-container {
            max-width: 1100px;
            margin: 0 auto;
        }
    </style>
</head>

<body class="bg-gray-900 text-white">
    <main class="main-container">
        
        <h1 style="text-align: center; color: #00ff41; margin-bottom: 25px; font-size: 22px; text-transform: uppercase; letter-spacing: 2px;">
            PS4 Exploit Host - Firmware 14.02 (Dedicated)
        </h1>

        <!-- شبكة عرض الكونسول والبايلودز جنباً إلى جنب -->
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px;" class="grid md:grid-cols-2">
            
            <!-- لوحة حالة الثغرة والـ Console -->
            <div id="exploit-status-panel" class="bg-gray-800 p-6 rounded-lg flex flex-col h-full" style="background: #1f2937; padding: 20px; border-radius: 8px; border: 1px solid #374151;">
                <div class="flex justify-between items-center mb-4">
                    <h2 class="text-xl font-semibold" id="state" style="font-size: 18px; color: #00ff41;">Exploit Status (14.02)</h2>
                    <button id="successRate" class="text-sm cursor-pointer" onclick="clearStats()" style="background: none; border: none; color: #9ca3af;">Success rate</button>
                </div>
                
                <!-- شاشة الـ Debug Console الحية -->
                <div id="DebugConsole" class="bg-black/50 p-4 rounded-lg overflow-y-auto mb-4 text-xs font-mono" style="background: #000; padding: 12px; border-radius: 6px; height: 180px; overflow-y: auto; color: #00ff41; border: 1px solid #374151;" dir="ltr">
                    <pre id='console'>[+] Waiting to initialize 14.02 exploit chain...</pre>
                </div>

                <!-- خيار الـ HEN وزر التشغيل -->
                <div id="henSelection" class="flex items-center justify-between mt-auto">
                    <label class="flex items-center gap-2 cursor-pointer">
                        <input type="radio" name="hen2" value="GoldHEN" checked onchange="saveJbFlavor(this.name, this.value)">
                        <span class="font-semibold">GoldHEN</span>
                    </label>
                    <button id="exploitRun" class="bg-blue-600 hover:bg-blue-700 p-3 rounded-full transition-colors cursor-pointer" style="background: #2563eb; border: none; padding: 10px 20px; border-radius: 6px; color: #fff; font-weight: bold;">
                        Run Exploit
                    </button>
                </div>
            </div>

            <!-- قسم البايلودز (Payloads Section) - محتفظ بكامل عناصره ووظائفه -->
            <div id="payloadsSection" class="bg-gray-800 p-6 rounded-lg flex flex-col h-full" style="background: #1f2937; padding: 20px; border-radius: 8px; border: 1px solid #374151;">
                <h2 class="text-xl font-semibold mb-4" id="payloads-section-title" style="font-size: 18px; color: #fff;">Payloads Hub</h2>
                
                <!-- تبويبات البايلودز (Tools, Homebrew, Linux, Custom) -->
                <div class="border-b border-gray-700 w-full mb-4 tabs">
                    <ul class="flex flex-wrap text-sm font-medium text-center" id="default-tab" data-tabs-toggle="#default-tab-content" role="tablist" style="display: flex; list-style: none; padding: 0; margin: 0; gap: 5px;">
                        <li style="flex: 1;"><button class="w-full p-2 rounded bg-gray-700 text-center cursor-pointer" id="tools-tab" data-tabs-target="#tools" type="button" role="tab" style="width:100%; background:#374151; border:none; color:#fff; padding:8px; border-radius:4px;">Tools</button></li>
                        <li style="flex: 1;"><button class="w-full p-2 rounded bg-gray-700 text-center cursor-pointer" id="homebrew-tab" data-tabs-target="#homebrew" type="button" role="tab" style="width:100%; background:#374151; border:none; color:#fff; padding:8px; border-radius:4px;">Homebrew</button></li>
                        <li style="flex: 1;"><button class="w-full p-2 rounded bg-gray-700 text-center cursor-pointer" id="linux-tab" data-tabs-target="#linux" type="button" role="tab" style="width:100%; background:#374151; border:none; color:#fff; padding:8px; border-radius:4px;">Linux</button></li>
                        <li style="flex: 1;"><button class="w-full p-2 rounded bg-gray-700 text-center cursor-pointer" id="custom-tab" data-tabs-target="#custom" type="button" role="tab" style="width:100%; background:#374151; border:none; color:#fff; padding:8px; border-radius:4px;">Custom</button></li>
                    </ul>
                </div>

                <!-- مساحة عرض القوائم والبايلودز -->
                <div id="payloadsGrid" class="space-y-3 overflow-y-auto flex-grow" style="max-height: 200px; overflow-y: auto;" style="overflow-x: hidden !important;">
                    <div id="default-tab-content">
                        <div class="p-2 rounded bg-gray-700/50" id="tools" role="tabpanel" aria-labelledby="tools-tab"></div>
                        <div class="p-2 rounded bg-gray-700/50" id="homebrew" role="tabpanel" aria-labelledby="homebrew-tab"></div>
                        <div class="p-2 rounded bg-gray-700/50" id="linux" role="tabpanel" aria-labelledby="linux-tab"></div>
                        <div class="p-2 rounded bg-gray-700/50" id="custom" role="tabpanel" aria-labelledby="custom-tab">
                            <p class="text-sm text-white/80 mb-2" id="customPayloadUpload">Upload a custom payload (.bin / .elf)</p>
                            <div class="flex gap-2" style="display: flex; gap: 8px;">
                                <input type="file" id="customPayloadInput" class="bg-gray-700 p-1 rounded flex-grow text-sm text-white" accept=".bin,.elf" style="background:#374151; color:#fff; border:none; padding:4px;">
                                <button id="sendCustomPayloadBtn" onclick="Loadpayloads('custom')" class="bg-blue-600 px-3 py-1 rounded text-sm font-semibold cursor-pointer" style="background:#2563eb; color:#fff; border:none; border-radius:4px;">Send</button>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- عنصر مخفي تطلبه السكريبتات لضبط الفيرجين تلقائياً -->
                <select id="ps4FwSelect" style="display: none;">
                    <option value="14.02" selected>14.02</option>
                </select>
            </div>

        </div>
    </main>

    <!-- السكريبتات الأساسية المسؤولة عن تشغيل الثغرة وجلب البايلودز (مطلوبة 100% للعمل) -->
    <script>
        window.targetFirmware = "14.02";
        
        window.onerror = function (msg, url, lineno, colno, error) {
            var errorConsole = document.getElementById('console');
            if (errorConsole) {
                errorConsole.textContent += '\n[Error]: ' + msg;
            }
            return true;
        };
    </script>
    <script src="./includes/js/storage.js"></script>
    <script src="./includes/js/testMode.js"></script>
    <script src="./includes/js/firmware.js"></script>
    <script src="./includes/js/utilities.js"></script>
    <script src="./includes/js/HENs.js"></script>
    <script src="./includes/js/checkFw.js"></script>
    
    <script id="main-logic-loader">
        (function () {
            var isModern = 'noModule' in document.createElement('script');
            var scriptPath = isModern ? './includes/js/jailbreak.js' : './includes/js/jailbreak-legacy.js';
            document.write('<script src="' + scriptPath + '"><\/script>');
        })();
    </script>
    
    <script src="./includes/js/initial.js"></script>
    <script src="./includes/js/cache.js"></script>
    <script src="./includes/js/deliverPayload.js"></script>
    <script src="./includes/js/payloadsList.js"></script>
    <script src="./includes/js/design.js"></script>
    <script src="./includes/js/language.js"></script>
    <script src="./includes/js/autoJbRetry.js"></script>
    <script src="./includes/js/events.js"></script>
    <script src="./includes/js/payloadsHandler.js"></script>
    
    <script>
        document.addEventListener('DOMContentLoaded', function () {
            if (window.abortLoading) return;
            if (typeof loadSettings === 'function') {
                loadSettings();
            }
        });
    </script>
</body>

</html>
